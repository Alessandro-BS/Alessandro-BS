<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Aless Bustamante — Full Stack Developer, Ingeniería de Software">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfdbe6" stroke-width=".6"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g)"/><path d="M100 0H0V100" fill="none" stroke="#adc0d2" stroke-width=".9"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <style>
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .ink { fill: #1f2a44; } .mut { fill: #5b6785; } .acc { fill: #e8590c; }
      .draw {}
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .in {}
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .pipe { stroke-dasharray: 6 5; animation: run 1s linear infinite; } @keyframes run { to { stroke-dashoffset: -22; } }
      .st { fill: #2f9e44; animation: beat 3.2s ease-in-out infinite; }
      @keyframes beat { 0%,20%,100% { fill: #2f9e44; } 10% { fill: #e8590c; } }
      .ck {}
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .3; } }
      .cls {}
      @keyframes cls { from { opacity: 0; transform: translate(14px, -6px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <!-- Papel de ingeniería -->
  <rect width="1000" height="310" rx="6" fill="#f7f4ec"/>
  <rect width="1000" height="310" rx="6" fill="url(#G)"/>
  <rect x="10" y="10" width="980" height="290" fill="none" stroke="#1f2a44" stroke-width="1.6"/>
  <g stroke="#1f2a44" stroke-width="1.6"><path d="M10 30H22M30 10V22M990 30H978M970 10V22M10 280H22M30 300V288M990 280H978M970 300V288"/></g>

  <!-- Encabezado -->
  <g class="m">
    <text class="in acc" x="44" y="58" font-size="13" font-weight="700" letter-spacing="1">// INGENIERÍA DE SOFTWARE · 7.º CICLO</text>
    <text class="in ink" style="animation-delay:.1s" x="42" y="104" font-size="44" font-weight="800" letter-spacing="-1">Aless Bustamante</text>
  </g>

  <!-- Cota (línea de dimensión) -->
  <g>
    <path d="M44 120V138M466 120V138" stroke="#1f2a44" stroke-width="1"/>
    <path class="draw" d="M46 129H464" stroke="#1f2a44" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect class="in" style="animation-delay:1.1s" x="160" y="119" width="190" height="20" fill="#f7f4ec"/>
    <text class="m in ink" style="animation-delay:1.1s" x="255" y="134" font-size="13" font-weight="700" text-anchor="middle">Full Stack Developer</text>
  </g>
  <text class="m in mut" style="animation-delay:.5s" x="44" y="170" font-size="14">web · móvil · agentes de IA  —  Lima, Perú</text>

  <!-- Pipeline CI -->
  <g class="m" font-size="11" text-anchor="middle">
    <text class="mut" x="44" y="208" text-anchor="start" font-size="11" letter-spacing="1">PIPELINE</text>
    <g stroke="#1f2a44" stroke-width="2" fill="none">
      <path class="pipe" style="animation-delay:1.6s" d="M66 238H156"/>
      <path class="pipe" style="animation-delay:2.1s" d="M166 238H256"/>
      <path class="pipe" style="animation-delay:2.6s" d="M266 238H356"/>
    </g>
    <g stroke="#1f2a44" stroke-width="2">
      <circle class="st" style="animation-delay:1.4s" cx="58" cy="238" r="9"/>
      <circle class="st" style="animation-delay:1.9s" cx="161" cy="238" r="9"/>
      <circle class="st" style="animation-delay:2.4s" cx="261" cy="238" r="9"/>
      <circle class="st" style="animation-delay:2.9s" cx="361" cy="238" r="9"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
      <path class="ck" style="animation-delay:1.5s" d="M54 238l3 3 6-6"/>
      <path class="ck" style="animation-delay:2.0s" d="M157 238l3 3 6-6"/>
      <path class="ck" style="animation-delay:2.5s" d="M257 238l3 3 6-6"/>
      <path class="ck" style="animation-delay:3.0s" d="M357 238l3 3 6-6"/>
    </g>
    <text class="ink" x="58" y="266">commit</text><text class="ink" x="161" y="266">build</text><text class="ink" x="261" y="266">test</text><text class="ink" x="361" y="266">deploy</text>
    <g class="in" style="animation-delay:3.2s">
      <rect x="392" y="227" width="104" height="22" rx="11" fill="#2f9e44"/>
      <circle class="blink" cx="406" cy="238" r="4" fill="#fff"/>
      <text x="452" y="242" fill="#fff" font-weight="700">producción</text>
    </g>
  </g>

  <!-- Clase UML -->
  <g class="cls m">
    <rect x="596" y="40" width="360" height="232" fill="#1f2a44"/>
    <rect x="588" y="32" width="360" height="232" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
    <rect x="588" y="32" width="360" height="52" fill="#e8590c" stroke="#1f2a44" stroke-width="2"/>
    <text x="768" y="52" font-size="12" fill="#fff3e8" text-anchor="middle">«developer»</text>
    <text x="768" y="73" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AlessBustamante</text>
    <g font-size="12.5" class="ink">
      <text x="604" y="108"><tspan class="acc">-</tspan> rol: <tspan font-weight="700">FullStackDeveloper</tspan></text>
      <text x="604" y="128"><tspan class="acc">-</tspan> stack: Set&lt;PHP, Kotlin, TS, Java&gt;</text>
      <text x="604" y="148"><tspan class="acc">-</tspan> interés: [DataEngineering, IA·Cloud]</text>
    </g>
    <path d="M588 162H948" stroke="#1f2a44" stroke-width="2"/>
    <g font-size="12.5" class="ink">
      <text x="604" y="186"><tspan fill="#2f9e44">+</tspan> diseñar(): CleanArchitecture</text>
      <text x="604" y="206"><tspan fill="#2f9e44">+</tspan> construir(web, móvil, ia): Producto</text>
      <text x="604" y="226"><tspan fill="#2f9e44">+</tspan> probar(): TDD ✓</text>
      <text x="604" y="246"><tspan fill="#2f9e44">+</tspan> desplegar(): GitFlow → main</text>
    </g>
  </g>
</svg>
