<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Educa LMS — diagrama de despliegue: una base de código, cuatro institutos">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfdbe6" stroke-width=".6"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g)"/><path d="M100 0H0V100" fill="none" stroke="#adc0d2" stroke-width=".9"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#1f2a44" stroke-width="1.6"/></marker>
    <style>
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .ink { fill: #1f2a44; } .mut { fill: #5b6785; } .acc { fill: #e8590c; }
      .flow { stroke-dasharray: 7 6; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      .in { opacity: 0; animation: in .6s ease forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .nd { opacity: 0; animation: nd .6s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes nd { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
      .soon { animation: soon 1.8s ease-in-out infinite; }
      @keyframes soon { 50% { opacity: .35; } }
    </style>
  </defs>

  <rect width="1000" height="470" rx="6" fill="#f7f4ec"/>
  <rect width="1000" height="470" rx="6" fill="url(#G)"/>
  <rect x="10" y="10" width="980" height="450" fill="none" stroke="#1f2a44" stroke-width="1.6"/>

  <!-- Título de figura -->
  <g class="m">
    <rect x="34" y="32" width="64" height="24" fill="#e8590c"/>
    <text x="66" y="49" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">FIG. 1</text>
    <text x="112" y="50" font-size="20" font-weight="800" class="ink">Educa LMS <tspan font-weight="400" class="mut" font-size="15">— diagrama de despliegue</tspan></text>
    <text x="36" y="80" font-size="13" class="mut">Una base de código, cuatro institutos. El código se escribe una vez y se genera por marca.</text>
  </g>

  <!-- Componente: repositorio -->
  <g class="m in" style="animation-delay:.1s">
    <rect x="46" y="118" width="250" height="196" fill="#1f2a44"/>
    <rect x="40" y="112" width="250" height="196" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
    <!-- icono de componente UML -->
    <rect x="262" y="122" width="16" height="20" fill="none" stroke="#1f2a44" stroke-width="1.5"/>
    <rect x="257" y="126" width="10" height="4" fill="#fffdf7" stroke="#1f2a44" stroke-width="1.5"/>
    <rect x="257" y="134" width="10" height="4" fill="#fffdf7" stroke="#1f2a44" stroke-width="1.5"/>
    <text x="56" y="134" font-size="11" class="mut">«repositorio»</text>
    <text x="56" y="154" font-size="15" font-weight="800" class="ink">educa-lms</text>
    <path d="M40 166H290" stroke="#1f2a44" stroke-width="1.5"/>
    <!-- mini git graph -->
    <path d="M70 186V286" stroke="#1f2a44" stroke-width="2"/>
    <g stroke="#1f2a44" stroke-width="2">
      <circle cx="70" cy="190" r="6" fill="#2f9e44"/>
      <circle cx="70" cy="222" r="6" fill="#1c7ed6"/>
      <circle cx="70" cy="254" r="6" fill="#9c36b5"/>
      <circle cx="70" cy="286" r="6" fill="#e8590c"/>
    </g>
    <g font-size="12.5" class="ink">
      <text x="88" y="194">feature/*</text>
      <text x="88" y="226">develop <tspan class="mut">→ staging</tspan></text>
      <text x="88" y="258">release/* <tspan class="mut">→ QA</tspan></text>
      <text x="88" y="290" font-weight="700">main <tspan class="mut" font-weight="400">· vAAAA.MM.N</tspan></text>
    </g>
  </g>

  <!-- Repo -> herramienta -->
  <path class="flow" d="M290 222H356" stroke="#1f2a44" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text class="m mut" x="323" y="212" font-size="11" text-anchor="middle">«tag»</text>

  <!-- Herramienta generadora -->
  <g class="m in" style="animation-delay:.3s">
    <rect x="366" y="178" width="200" height="96" fill="#1f2a44"/>
    <rect x="360" y="172" width="200" height="96" fill="#e8590c" stroke="#1f2a44" stroke-width="2"/>
    <text x="460" y="196" font-size="11" fill="#fff3e8" text-anchor="middle">«herramienta»</text>
    <text x="460" y="220" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">generar-marca</text>
    <text x="460" y="244" font-size="11" fill="#fff3e8" text-anchor="middle">nombre · color · logo</text>
    <text x="460" y="259" font-size="11" fill="#fff3e8" text-anchor="middle">series de facturación</text>
  </g>

  <!-- Interfaz de integraciones (lollipop UML) -->
  <g class="m in" style="animation-delay:1.3s">
    <path d="M460 268V298" stroke="#1f2a44" stroke-width="1.6"/>
    <circle cx="460" cy="305" r="7" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
    <text x="460" y="330" font-size="11" class="mut" text-anchor="middle">«integraciones»</text>
    <text x="460" y="347" font-size="12" font-weight="700" class="ink" text-anchor="middle">Pancake · Pancake CRM · Botcake · n8n</text>
  </g>

  <!-- Herramienta -> nodos -->
  <g fill="none" stroke="#1f2a44" stroke-width="1.6" marker-end="url(#a)">
    <path class="flow" d="M560 220C600 220 600 140 652 140"/>
    <path class="flow" d="M560 220C605 220 605 196 652 196"/>
    <path class="flow" d="M560 220C605 220 605 252 652 252"/>
    <path class="flow" d="M560 220C600 220 600 308 652 308" stroke-opacity=".45"/>
  </g>
  <text class="m mut" x="596" y="118" font-size="11" text-anchor="middle">«genera»</text>

  <!-- Nodos UML (servidores) -->
  <g class="m" font-size="13">
    <g class="nd" style="animation-delay:.6s">
      <path d="M662 118l8-8h282l-8 8zM944 118l8-8v44l-8 8z" fill="#dfe7f1" stroke="#1f2a44" stroke-width="1.5"/>
      <rect x="662" y="118" width="282" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="676" y="145" class="mut" font-size="11">«servidor»</text>
      <text x="752" y="145" class="ink" font-weight="800">EDUCA</text>
      <rect x="836" y="129" width="98" height="22" rx="11" fill="#2f9e44"/>
      <text x="885" y="144" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">producción</text>
    </g>
    <g class="nd" style="animation-delay:.8s">
      <path d="M662 174l8-8h282l-8 8zM944 174l8-8v44l-8 8z" fill="#dfe7f1" stroke="#1f2a44" stroke-width="1.5"/>
      <rect x="662" y="174" width="282" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="676" y="201" class="mut" font-size="11">«servidor»</text>
      <text x="752" y="201" class="ink" font-weight="800">IPSE</text>
      <rect x="836" y="185" width="98" height="22" rx="11" fill="#2f9e44"/>
      <text x="885" y="200" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">producción</text>
    </g>
    <g class="nd" style="animation-delay:1s">
      <path d="M662 230l8-8h282l-8 8zM944 230l8-8v44l-8 8z" fill="#dfe7f1" stroke="#1f2a44" stroke-width="1.5"/>
      <rect x="662" y="230" width="282" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="676" y="257" class="mut" font-size="11">«servidor»</text>
      <text x="752" y="257" class="ink" font-weight="800">ICEPP</text>
      <rect x="836" y="241" width="98" height="22" rx="11" fill="#2f9e44"/>
      <text x="885" y="256" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">producción</text>
    </g>
    <g class="nd" style="animation-delay:1.2s">
      <path d="M662 286l8-8h282l-8 8zM944 286l8-8v44l-8 8z" fill="none" stroke="#1f2a44" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="662" y="286" width="282" height="44" fill="#f7f4ec" stroke="#1f2a44" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="676" y="313" class="mut" font-size="11">«servidor»</text>
      <text x="752" y="313" class="ink" font-weight="800">CESUP</text>
      <rect class="soon" x="836" y="297" width="98" height="22" rx="11" fill="#f59f00"/>
      <text x="885" y="312" fill="#1f2a44" font-size="11" font-weight="700" text-anchor="middle">en camino</text>
    </g>
  </g>

  <!-- Reporte / métricas como tabla técnica -->
  <g class="m">
    <text x="36" y="366" font-size="11" class="mut" letter-spacing="1">ESPECIFICACIONES</text>
    <g class="in" style="animation-delay:1.4s">
      <rect x="36" y="376" width="928" height="62" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <path d="M190.7 376V438M345.3 376V438M500 376V438M654.7 376V438M809.3 376V438" stroke="#1f2a44" stroke-width="1.2"/>
      <g text-anchor="middle">
        <text x="113" y="405" font-size="20" font-weight="800" class="ink">6</text><text x="113" y="425" font-size="11" class="mut">roles con permisos</text>
        <text x="268" y="405" font-size="20" font-weight="800" class="ink">216</text><text x="268" y="425" font-size="11" class="mut">páginas por rol</text>
        <text x="423" y="405" font-size="20" font-weight="800" class="ink">35</text><text x="423" y="425" font-size="11" class="mut">endpoints de API</text>
        <text x="577" y="405" font-size="20" font-weight="800" class="ink">19</text><text x="577" y="425" font-size="11" class="mut">trabajos cron</text>
        <text x="732" y="405" font-size="20" font-weight="800" fill="#2f9e44">385 ✓</text><text x="732" y="425" font-size="11" class="mut">pruebas PHPUnit</text>
        <text x="887" y="405" font-size="20" font-weight="800" class="acc">PHP 8.3</text><text x="887" y="425" font-size="11" class="mut">sin framework</text>
      </g>
    </g>
  </g>
</svg>
