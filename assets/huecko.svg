<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="HueckoApp — coordinación de horarios grupales en Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f24"/>
      <stop offset="1" stop-color="#1d1535"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6750A4"/>
      <stop offset="1" stop-color="#8b6fd6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      .f { font-family: 'Segoe UI', 'Roboto', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .c { opacity: 0; animation: cell .5s ease forwards; }
      @keyframes cell { to { opacity: 1; } }
      .hit { animation: hit 2.6s ease-in-out 2.2s infinite; }
      @keyframes hit { 0%,100% { stroke-opacity: .2; } 50% { stroke-opacity: 1; } }
      .toast { opacity: 0; animation: toast .7s cubic-bezier(.2,.8,.2,1) 2.4s forwards; }
      @keyframes toast { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: bar 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes bar { to { transform: scaleX(1); } }
      .feat { opacity: 0; animation: feat .6s ease forwards; }
      @keyframes feat { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
      .phone { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1000" height="440" rx="18" fill="url(#bg)"/>
  <circle cx="230" cy="220" r="150" fill="#6750A4" opacity=".35" filter="url(#blur)"/>
  <rect x=".5" y=".5" width="999" height="439" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Teléfono -->
  <g class="phone">
    <g transform="translate(110 26)">
      <rect width="236" height="388" rx="30" fill="#0b0814" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
      <rect x="10" y="10" width="216" height="368" rx="22" fill="#fef7ff"/>
      <rect x="93" y="18" width="50" height="8" rx="4" fill="#0b0814"/>
      <!-- cabecera -->
      <rect x="10" y="10" width="216" height="74" rx="22" fill="url(#hdr)"/>
      <rect x="10" y="60" width="216" height="24" fill="url(#hdr)"/>
      <g class="f">
        <text x="26" y="52" font-size="11" fill="#eaddff">Grupo · Taller UTP</text>
        <text x="26" y="72" font-size="16" font-weight="700" fill="#ffffff">Horario en común</text>
      </g>
      <!-- días -->
      <g class="f" font-size="10" fill="#625B71" text-anchor="middle" font-weight="600">
        <text x="66" y="106">LUN</text><text x="102" y="106">MAR</text><text x="138" y="106">MIÉ</text><text x="174" y="106">JUE</text><text x="210" y="106">VIE</text>
      </g>
      <g class="f" font-size="9" fill="#938F99" text-anchor="end">
        <text x="44" y="126">10h</text><text x="44" y="156">12h</text><text x="44" y="186">14h</text><text x="44" y="216">16h</text><text x="44" y="246">18h</text>
      </g>
      <!-- heatmap 5x5: opacidad = % del grupo libre -->
      <g>
        <rect class="c" style="animation-delay:.10s" x="51" y="114" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".20"/>
        <rect class="c" style="animation-delay:.15s" x="87" y="114" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".45"/>
        <rect class="c" style="animation-delay:.20s" x="123" y="114" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".15"/>
        <rect class="c" style="animation-delay:.25s" x="159" y="114" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".35"/>
        <rect class="c" style="animation-delay:.30s" x="195" y="114" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".25"/>

        <rect class="c" style="animation-delay:.35s" x="51" y="144" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".30"/>
        <rect class="c" style="animation-delay:.40s" x="87" y="144" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".55"/>
        <rect class="c" style="animation-delay:.45s" x="123" y="144" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".20"/>
        <rect class="c" style="animation-delay:.50s" x="159" y="144" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".40"/>
        <rect class="c" style="animation-delay:.55s" x="195" y="144" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".15"/>

        <rect class="c" style="animation-delay:.60s" x="51" y="174" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".15"/>
        <rect class="c" style="animation-delay:.65s" x="87" y="174" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".35"/>
        <rect class="c" style="animation-delay:.70s" x="123" y="174" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".50"/>
        <rect class="c" style="animation-delay:.75s" x="159" y="174" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".85"/>
        <rect class="c" style="animation-delay:.80s" x="195" y="174" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".30"/>

        <rect class="c" style="animation-delay:.85s" x="51" y="204" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".25"/>
        <rect class="c" style="animation-delay:.90s" x="87" y="204" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".40"/>
        <rect class="c" style="animation-delay:.95s" x="123" y="204" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".60"/>
        <rect class="c" style="animation-delay:1.0s" x="159" y="204" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".95"/>
        <rect class="c" style="animation-delay:1.05s" x="195" y="204" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".35"/>

        <rect class="c" style="animation-delay:1.1s" x="51" y="234" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".10"/>
        <rect class="c" style="animation-delay:1.15s" x="87" y="234" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".20"/>
        <rect class="c" style="animation-delay:1.2s" x="123" y="234" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".30"/>
        <rect class="c" style="animation-delay:1.25s" x="159" y="234" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".45"/>
        <rect class="c" style="animation-delay:1.3s" x="195" y="234" width="30" height="26" rx="6" fill="#6750A4" fill-opacity=".20"/>
      </g>
      <!-- hueco detectado -->
      <rect class="hit" x="155" y="170" width="38" height="64" rx="9" fill="none" stroke="#ffcd42" stroke-width="2.5"/>
      <!-- tarjeta -->
      <g class="toast f">
        <rect x="24" y="276" width="188" height="88" rx="14" fill="#ffffff" stroke="#E8DEF8" stroke-width="1.5"/>
        <text x="38" y="298" font-size="10" fill="#625B71" font-weight="600" letter-spacing=".6">HUECO ENCONTRADO</text>
        <text x="38" y="318" font-size="14" fill="#1D192B" font-weight="700">Jue · 14:00 – 18:00</text>
        <rect x="38" y="330" width="120" height="8" rx="4" fill="#E8DEF8"/>
        <rect class="bar" style="animation-delay:2.9s" x="38" y="330" width="96" height="8" rx="4" fill="#6750A4"/>
        <text x="166" y="338" font-size="10" fill="#6750A4" font-weight="700">80%</text>
        <text x="38" y="355" font-size="10" fill="#625B71">4 de 5 libres · supera el quórum</text>
      </g>
    </g>
  </g>

  <!-- Texto -->
  <g class="f">
    <text x="420" y="70" font-size="12" font-weight="700" fill="#d0bcff" letter-spacing="2.5">APP ANDROID NATIVA · v1.0.0</text>
    <text x="420" y="108" font-size="32" font-weight="800" fill="#ffffff">HueckoApp</text>
    <text x="420" y="138" font-size="16" fill="#b8aed6">Encuentra el hueco en el que todo tu grupo puede.</text>

    <g transform="translate(420 170)"><g class="feat" style="animation-delay:.4s">
      <rect width="540" height="48" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="18" y="30" font-size="18">📸</text>
      <text x="52" y="22" font-size="14" font-weight="700" fill="#ffffff">Horario desde una foto</text>
      <text x="52" y="39" font-size="12" fill="#a99fc9">OCR con Gemini (Firebase AI) y revisión humana antes de guardar</text>
    </g></g>
    <g transform="translate(420 226)"><g class="feat" style="animation-delay:.6s">
      <rect width="540" height="48" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="18" y="30" font-size="18">🔥</text>
      <text x="52" y="22" font-size="14" font-weight="700" fill="#ffffff">Cruce de agendas con heatmap</text>
      <text x="52" y="39" font-size="12" fill="#a99fc9">Franjas por umbral del grupo, medidas por su hora menos disponible</text>
    </g></g>
    <g transform="translate(420 282)"><g class="feat" style="animation-delay:.8s">
      <rect width="540" height="48" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="18" y="30" font-size="18">🗳️</text>
      <text x="52" y="22" font-size="14" font-weight="700" fill="#ffffff">Planes y votación por quórum</text>
      <text x="52" y="39" font-size="12" fill="#a99fc9">Propuestas con plazo, votos excluyentes e integrantes imprescindibles</text>
    </g></g>
    <g transform="translate(420 338)"><g class="feat" style="animation-delay:1s">
      <rect width="540" height="48" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="18" y="30" font-size="18">🧱</text>
      <text x="52" y="22" font-size="14" font-weight="700" fill="#ffffff">Kotlin · Jetpack Compose · MVVM</text>
      <text x="52" y="39" font-size="12" fill="#a99fc9">Material 3, capas domain/data/ui y pruebas con coroutines-test</text>
    </g></g>
  </g>
</svg>
