<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="HueckoApp — diagrama de secuencia: del horario en foto al hueco del grupo">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfdbe6" stroke-width=".6"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g)"/><path d="M100 0H0V100" fill="none" stroke="#adc0d2" stroke-width=".9"/></pattern>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#1f2a44" stroke-width="1.6"/></marker>
    <style>
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .ink { fill: #1f2a44; } .mut { fill: #5b6785; } .acc { fill: #e8590c; }
      .msg { animation: hl 5s linear infinite; }
      @keyframes hl { 0%, 9% { stroke: #e8590c; stroke-width: 2.6px; } 12%, 100% { stroke: #1f2a44; stroke-width: 1.6px; } }
      @keyframes msg { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
      .life { stroke-dasharray: 5 5; }
      .note {}
      .hit { animation: hit 1.6s ease-in-out infinite; }
      @keyframes hit { 50% { fill: #ffe8d6; } }
    </style>
  </defs>

  <rect width="1000" height="500" rx="6" fill="#f7f4ec"/>
  <rect width="1000" height="500" rx="6" fill="url(#G)"/>
  <rect x="10" y="10" width="980" height="480" fill="none" stroke="#1f2a44" stroke-width="1.6"/>

  <!-- Título -->
  <g class="m">
    <rect x="34" y="30" width="64" height="24" fill="#e8590c"/>
    <text x="66" y="47" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">FIG. 2</text>
    <text x="112" y="48" font-size="20" font-weight="800" class="ink">HueckoApp <tspan font-weight="400" class="mut" font-size="15">— diagrama de secuencia</tspan></text>
    <text x="964" y="47" font-size="12" class="mut" text-anchor="end">v1 Kotlin → v2 Expo · 988 tests ✓</text>
  </g>

  <!-- Líneas de vida -->
  <g stroke="#1f2a44" stroke-width="1.2" class="life">
    <path d="M100 116V426"/><path d="M280 116V426"/><path d="M490 116V426"/><path d="M690 116V426"/><path d="M880 116V426"/>
  </g>
  <!-- barras de activación -->
  <g fill="#fffdf7" stroke="#1f2a44" stroke-width="1.4">
    <rect x="274" y="126" width="12" height="290"/>
    <rect x="484" y="156" width="12" height="230"/>
  </g>

  <!-- Participantes -->
  <g class="m" text-anchor="middle">
    <g><rect x="34" y="72" width="132" height="44" fill="#1f2a44"/><rect x="30" y="68" width="132" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="96" y="88" font-size="10" class="mut">«actor»</text><text x="96" y="104" font-size="13" font-weight="800" class="ink">Usuario</text></g>
    <g><rect x="218" y="72" width="132" height="44" fill="#1f2a44"/><rect x="214" y="68" width="132" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="280" y="88" font-size="10" class="mut">Expo · RN</text><text x="280" y="104" font-size="13" font-weight="800" class="ink">App móvil</text></g>
    <g><rect x="428" y="72" width="132" height="44" fill="#1f2a44"/><rect x="424" y="68" width="132" height="44" fill="#e8590c" stroke="#1f2a44" stroke-width="2"/>
      <text x="490" y="88" font-size="10" fill="#fff3e8">Express 5 · zod</text><text x="490" y="104" font-size="13" font-weight="800" fill="#fff">API REST</text></g>
    <g><rect x="628" y="72" width="132" height="44" fill="#1f2a44"/><rect x="624" y="68" width="132" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="690" y="88" font-size="10" class="mut">solo backend</text><text x="690" y="104" font-size="13" font-weight="800" class="ink">Gemini</text></g>
    <g><rect x="818" y="72" width="132" height="44" fill="#1f2a44"/><rect x="814" y="68" width="132" height="44" fill="#fffdf7" stroke="#1f2a44" stroke-width="2"/>
      <text x="880" y="88" font-size="10" class="mut">Neon · PGlite</text><text x="880" y="104" font-size="13" font-weight="800" class="ink">PostgreSQL</text></g>
  </g>

  <!-- Mensajes -->
  <g class="m" font-size="12" fill="none" stroke="#1f2a44" stroke-width="1.6">
    <g class="msg" style="animation-delay:.4s"><path d="M100 140H272" marker-end="url(#s)"/><text x="186" y="133" stroke="none" class="ink" text-anchor="middle">📷 foto del horario</text></g>
    <g class="msg" style="animation-delay:.8s"><path d="M286 170H482" marker-end="url(#s)"/><text x="385" y="163" stroke="none" class="ink" text-anchor="middle">POST /ocr · JWT</text></g>
    <g class="msg" style="animation-delay:1.2s"><path d="M496 200H688" marker-end="url(#s)"/><text x="592" y="193" stroke="none" class="ink" text-anchor="middle">extraer bloques</text></g>
    <g class="msg" style="animation-delay:1.6s"><path d="M690 230H498" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="592" y="223" stroke="none" class="mut" text-anchor="middle">JSON</text></g>
    <g class="msg" style="animation-delay:2.0s"><path d="M496 250H530V272H498" marker-end="url(#s)"/><text x="538" y="266" stroke="none" class="ink">validar con zod ✓</text></g>
    <g class="msg" style="animation-delay:2.4s"><path d="M496 300H878" marker-end="url(#s)"/><text x="780" y="293" stroke="none" class="ink" text-anchor="middle">guardar bloques</text></g>
    <g class="msg" style="animation-delay:2.9s"><path d="M286 330H482" marker-end="url(#s)"/><text x="385" y="323" stroke="none" class="ink" text-anchor="middle">GET disponibilidad</text></g>
    <g class="msg" style="animation-delay:3.3s"><path d="M496 356H878" marker-end="url(#s)"/><text x="780" y="349" stroke="none" class="ink" text-anchor="middle">horarios del grupo</text></g>
    <g class="msg" style="animation-delay:3.8s"><path d="M484 382H288" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="385" y="375" stroke="none" class="mut" text-anchor="middle">huecos ≥ umbral</text></g>
    <g class="msg" style="animation-delay:4.3s"><path d="M274 410H102" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="186" y="403" stroke="none" class="mut" text-anchor="middle">heatmap del grupo</text></g>
  </g>

  <!-- Nota UML -->
  <g class="note m">
    <path class="hit" d="M34 436H426L440 450V478H34Z" fill="#fffdf7"/>
    <path d="M34 436H426L440 450V478H34Z" fill="none" stroke="#1f2a44" stroke-width="1.8"/>
    <path d="M426 436V450H440" fill="none" stroke="#1f2a44" stroke-width="1.8"/>
    <path d="M100 426V436" stroke="#1f2a44" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="48" y="462" font-size="13" class="ink"><tspan class="acc" font-weight="800">Hueco:</tspan> Jue 14:00–18:00 · 80 % libre · quórum ✓</text>
  </g>
  <g class="note m" font-size="11">
    <text x="964" y="456" class="mut" text-anchor="end">la franja se mide por su hora MENOS disponible,</text>
    <text x="964" y="472" class="mut" text-anchor="end">no por el promedio</text>
  </g>
</svg>
